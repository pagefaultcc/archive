name: dependabot-automerge

# Machine-authored dependency bumps are approved and queued for merge only
# after the review workflow (backend PostgreSQL suite + frontend build/tests)
# has fully succeeded. Human-authored PRs are never touched by this workflow;
# their approval stays a human decision. Major version bumps are left for
# manual review: a broken major can pass tests and still hurt production.

on:
  workflow_run:
    workflows: [review]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Approve and queue Dependabot bump
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Approve and queue auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr list --head "$HEAD_BRANCH" --state open \
            --json number,author,baseRefName,headRefOid,labels --limit 5)"
          out="$(mktemp)"
          python3 - "$pr_json" <<'PY' > "$out"
          import json, os, sys
          prs = json.loads(sys.argv[1])
          candidates = [p for p in prs
                        if p["author"]["login"] in ("dependabot[bot]", "app/dependabot")
                        and p["baseRefName"] == "main"]
          if len(candidates) != 1:
              raise SystemExit(0)
          pr = candidates[0]
          labels = {label["name"] for label in pr.get("labels", [])}
          if "semver:major" in labels:
              print(f"major={pr['number']}")
          elif pr["headRefOid"] != os.environ["HEAD_SHA"]:
              # A newer push exists; its own review run handles approval.
              print(f"stale={pr['number']}")
          else:
              print(f"pr={pr['number']}")
          PY
          decision="$(sed -n 's/^\(major\|pr\|stale\)=//p' "$out" | tail -1)"
          kind="${decision%%=*}"; pr="${decision#*=}"
          if [[ "$kind" == "stale" ]]; then
            echo "Skipping run for $HEAD_SHA; a newer push re-triggers this workflow."
            exit 0
          fi
          if [[ "$kind" == "major" ]]; then
            gh pr comment "$pr" --body "Major version bump: left for manual review per repository policy — minor and patch bumps merge automatically once checks pass."
            echo "PR #$pr is a major bump; skipped auto-merge."
            exit 0
          fi
          if [[ -z "$pr" ]]; then
            echo "No eligible Dependabot PR for this run."
            exit 0
          fi
          gh pr review "$pr" --approve \
            --body "Dependency bump: Review gate green (backend PostgreSQL suite, frontend build/tests). Auto-approved by repository automation policy; merge queued behind required checks."
          gh pr merge "$pr" --squash --auto
          echo "PR #$pr approved and queued for auto-merge."
