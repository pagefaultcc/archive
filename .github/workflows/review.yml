name: review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend review
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: archive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: Go formatting and vet
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
      - name: Backend tests (unit + DB integration)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/archive?sslmode=disable
        run: go test -p 1 ./...

  frontend:
    name: Frontend review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build and tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test -- --run

  lint:
    name: Lint review
    # Reports findings without blocking the gate; becomes required once the
    # existing react-hooks findings are fixed.

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint
        # Step-level tolerance: job shows green while the failed step keeps
        # the findings visible. Make this required once react-hooks debt is fixed.
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          npm run lint
  gate:
    name: Review gate
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require both review jobs to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [[ "$BACKEND_RESULT" != success || "$FRONTEND_RESULT" != success ]]; then
            printf 'Review failed: backend=%s frontend=%s\n' "$BACKEND_RESULT" "$FRONTEND_RESULT"
            exit 1
          fi
